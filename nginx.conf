server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Proxy API requests to backend service
    location /api/ {
        proxy_pass http://backend:5004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Rewrite hardcoded localhost API URLs to relative paths (handled by nginx proxy)
    sub_filter_once off;
    sub_filter_types text/html application/javascript application/json text/javascript;
    sub_filter 'http://localhost:3001' '';
    sub_filter 'http://127.0.0.1:3001' '';
    sub_filter 'http://localhost:4000' '';
    sub_filter 'http://127.0.0.1:4000' '';
    sub_filter 'http://localhost:5000' '';
    sub_filter 'http://127.0.0.1:5000' '';
    sub_filter 'http://localhost:5001' '';
    sub_filter 'http://127.0.0.1:5001' '';
    sub_filter 'http://localhost:5004' '';
    sub_filter 'http://127.0.0.1:5004' '';
    sub_filter 'http://localhost:8000' '';
    sub_filter 'http://127.0.0.1:8000' '';
    sub_filter 'http://localhost:8080' '';
    sub_filter 'http://127.0.0.1:8080' '';

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
