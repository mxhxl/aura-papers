services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
    - 5002:5002
    networks:
    - app-network
    environment:
      PORT: ${PORT:-5002}
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
    - 8084:80
    networks:
    - app-network
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
    depends_on:
      backend:
        condition: service_started
networks:
  app-network:
    driver: bridge
