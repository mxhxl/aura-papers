services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
    - 5003:5003
    networks:
    - app-network
    environment:
      PORT: ${PORT:-5003}
      NODE_ENV: ${NODE_ENV:-production}
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        NODE_ENV: ${NODE_ENV:-production}
    restart: unless-stopped
    ports:
    - 8084:80
    networks:
    - app-network
    depends_on:
      backend:
        condition: service_started
networks:
  app-network:
    driver: bridge