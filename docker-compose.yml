services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
    - 5002:5002
    networks:
    - app-network
    environment:
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV}
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    ports:
    - 8084:80
    networks:
    - app-network
    depends_on:
      backend:
        condition: service_started
networks:
  app-network:
    driver: bridge